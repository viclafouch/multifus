name: checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: apps/desktop/src-tauri/Cargo.toml
          arguments: ''
          command: check

  checks:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: ./apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit --audit-level high

      - run: pnpm run lint

      - run: pnpm run format:check

      - run: pnpm --filter @multifus/desktop run test

      - run: pnpm --filter @multifus/desktop run build

      - run: pnpm --filter @multifus/desktop run format:rust:check

      - run: pnpm --filter @multifus/desktop run lint:rust

      - run: pnpm --filter @multifus/desktop run test:rust
