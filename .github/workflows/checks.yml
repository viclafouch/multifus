name: checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit --audit-level high

      - run: pnpm run lint

      - run: pnpm run format:check

      - run: pnpm --filter @multifus/desktop run test

      - run: pnpm --filter @multifus/desktop run build

      - run: pnpm --filter @multifus/desktop run format:rust:check

      - run: pnpm --filter @multifus/desktop run lint:rust

      - run: pnpm --filter @multifus/desktop run test:rust
