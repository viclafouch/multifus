# Builds the two bundles on a tag, signs and notarises the macOS one, and puts
# them in a draft release with the JSON the updater reads.
#
# Two jobs and not a matrix: what they do around the build has nothing in
# common, the Apple secrets and the notarisation being macOS's alone. They run
# one after the other for a reason of the updater, written on the Windows job.
#
# The release is left as a draft on purpose: the endpoint of the updater is
# `releases/latest/download/latest.json`, so publishing is what tells every
# installed Multifus that a new version exists. That has to stay a decision and
# not a side effect of pushing a tag.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # A tag is not a promise that anything passes. Without this, pushing one would
  # sign and notarise a bundle that no lint, no clippy and no test had ever seen.
  checks:
    uses: ./.github/workflows/checks.yml

  macos:
    needs: checks
    runs-on: macos-latest
    permissions:
      # The action creates the release and uploads the bundle to it.
      contents: write
    steps:
      - uses: actions/checkout@v5

      # The tag is what the release is named after, and `tauri.conf.json` is what
      # the updater compares against. Two versions that disagree would publish an
      # update nobody is ever offered, silently.
      - name: The tag and the bundle say the same version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          bundle="$(jq -r .version src-tauri/tauri.conf.json)"

          if [ "$tag" != "$bundle" ]; then
            echo "tag ${GITHUB_REF_NAME} against tauri.conf.json ${bundle}" >&2
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Signing. The identity is a secret and not a configuration key: it
          # carries a name and a team identifier, and this repository is written
          # as though it were public.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

          # Notarisation, which Apple requires of anything signed with a
          # Developer ID. Without it a downloaded bundle is quarantined and
          # refused. A missing team identifier fails the build; every other
          # missing piece only warns, so a half-filled set of secrets ships
          # something that works here and nowhere else. See the plan.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

          # The updater's own signature, which has nothing to do with Apple's:
          # it is what proves to an installed Multifus that the archive it just
          # downloaded came from this repository.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Multifus ${{ github.ref_name }}
          releaseBody: 'Le détail des changements est dans le CHANGELOG.'
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin

  # After macOS and not beside it, because both jobs write the same `latest.json`.
  # `tauri-action` reads the one already on the release and merges its platforms
  # into the one it uploads, which is a read then a write: run in parallel, the
  # slower job would publish a file where the faster one's platform never
  # existed, and no installed Multifus would ever be offered it.
  windows:
    needs: macos
    runs-on: windows-latest
    permissions:
      # The release already exists at this point; the bundle is uploaded to it.
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm ci

      # No target is named: the runner's own is the one wanted, and naming it
      # would only be a second place for `x86_64-pc-windows-msvc` to be wrong.
      #
      # One installer and not two, `all` being what the configuration says
      # otherwise. `latest.json` carries a single archive per platform, so
      # publishing the MSI beside the NSIS would update half the installations
      # with the other one's package. See the plan.
      #
      # Nothing signs it, so SmartScreen warns at every install. An Authenticode
      # certificate is bought elsewhere than a Developer ID and poses other
      # secrets; see the plan for why that waits.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # The updater's own signature, the same key as macOS: it is what proves
          # to an installed Multifus that the archive it just downloaded came
          # from this repository, whichever system built it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Multifus ${{ github.ref_name }}
          releaseBody: 'Le détail des changements est dans le CHANGELOG.'
          releaseDraft: true
          prerelease: false
          args: --bundles nsis
