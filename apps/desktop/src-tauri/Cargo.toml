[package]
name = "multifus"
version = "0.1.0"
description = "Gestionnaire de fenêtres Dofus Retro en multicompte, macOS et Windows."
authors = ["Victor de la Fouchardiere <victor.delafouchardiere@gmail.com>"]
license = "MIT"
repository = "https://github.com/viclafouch/multifus"
edition = "2024"

[lib]
# The `_lib` suffix keeps the library name off the binary's, which only Windows minds: https://github.com/rust-lang/cargo/issues/8519
name = "multifus_lib"
# `rlib` alone, which is all `main.rs` links: the other two crate types are mobile entry points, and Multifus has no mobile build.
crate-type = ["rlib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
keyring = "4"

[dev-dependencies]
tempfile = "3"
keyring-core = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "UI_Notifications",
  "UI_Notifications_Management",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Variant",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
  "Win32_Storage_EnhancedStorage",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { version = "0.62", features = ["Data_Xml_Dom"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
dispatch2 = "0.3"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "libc",
  "block2",
  "NSRunningApplication",
  "NSScreen",
  "NSWorkspace",
  "NSPanel",
  "NSResponder",
  "NSWindow",
] }
objc2-application-services = { version = "0.3", default-features = false, features = [
  "std",
  "libc",
  "HIServices",
  "AXError",
  "AXUIElement",
  "AXValue",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
  "std",
  "CGEvent",
  "CGEventSource",
  "CGEventTypes",
  "CGRemoteOperation",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "CFArray",
  "CFDictionary",
  "CFMachPort",
  "CFNumber",
  "CFPreferences",
  "CFRunLoop",
  "CFString",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSArray",
  "NSNotification",
  "NSString",
] }
