[package]
name = "multifus"
version = "0.1.0"
description = "Gestionnaire de fenêtres Dofus Retro en multicompte, macOS et Windows."
authors = ["Victor de la Fouchardiere <victor.delafouchardiere@gmail.com>"]
license = "MIT"
repository = "https://github.com/viclafouch/multifus"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix keeps the library name off the binary's, which only Windows
# minds, see https://github.com/rust-lang/cargo/issues/8519.
name = "multifus_lib"
# `rlib` alone, which is all `main.rs` links. `staticlib` and `cdylib` are the
# mobile entry points of the scaffolder, and multifus has none, see perimetre.md.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` is what step 8 stands on: without it the crate compiles and the
# menu bar icon simply does not exist.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
log = "0.4"
# The three crates of step 11, and they cost three. `rustls-no-provider` is the
# feature the updater already asks for; `keyring` takes no feature list, ADR 0009.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
keyring = "4"

[dev-dependencies]
# Only the configuration tests, which need a directory that disappears with them
# rather than a path written into the source.
tempfile = "3"

# The Windows side of the boundary, and nothing else in the crate, talks to this.
# Features land lot by lot, so that nothing compiles before it is called: these
# are lot A's, the notification and power ones come with lots B and C.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

# The macOS side of the boundary, and nothing else in the crate, talks to these.
# Feature sets are cut to what `platform::macos` calls, so that the Windows
# build never sees them and the macOS build stays small.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "libc",
  "NSRunningApplication",
] }
objc2-application-services = { version = "0.3", default-features = false, features = [
  "std",
  "libc",
  "HIServices",
  "AXError",
  "AXUIElement",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "CFArray",
  "CFDictionary",
  "CFNumber",
  # The screen saver delay, which the display assertion does not cover.
  "CFPreferences",
  "CFRunLoop",
  "CFString",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSString",
] }

