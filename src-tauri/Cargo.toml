[package]
name = "multifus"
version = "0.1.0"
description = "Gestionnaire de fenêtres Dofus Retro en multicompte, macOS et Windows."
authors = ["Victor de la Fouchardiere <victor.delafouchardiere@gmail.com>"]
license = "MIT"
repository = "https://github.com/viclafouch/multifus"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "multifus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` is what step 8 stands on: without it the crate compiles and the
# menu bar icon simply does not exist.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"

[dev-dependencies]
# Only the configuration tests, which need a directory that disappears with them
# rather than a path written into the source.
tempfile = "3"

# The macOS side of the boundary, and nothing else in the crate, talks to these.
# Feature sets are cut to what `platform::macos` calls, so that the Windows
# build never sees them and the macOS build stays small.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "libc",
  "NSRunningApplication",
] }
objc2-application-services = { version = "0.3", default-features = false, features = [
  "std",
  "libc",
  "HIServices",
  "AXError",
  "AXUIElement",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "CFArray",
  "CFDictionary",
  "CFNumber",
  "CFRunLoop",
  "CFString",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSString",
] }

